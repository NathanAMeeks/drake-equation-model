# =====================================================================
# Extended, time-aware Drake model for "stone-age-or-greater" worlds
# Single config file. To add a new variable:
#   * a new multiplicative habitability factor -> add an entry under `multipliers:`
#     (choose `applies_to: [gk, m]`), it is automatically sampled, used, and
#     included in the sensitivity analysis.
#   * a new evolutionary hard step -> add an entry under `hard_steps:`
#     (needs `earth_gya`, the date it happened on Earth, in billions of yrs ago).
#   * change any range/distribution in place, or override per scenario.
# Supported dists: fixed(value) | uniform(low,high) | loguniform(low,high)
#                  | normal(mean,sd,[min],[max]) | lognormal10(mu,sigma) [log10 space]
# `best` = value used in the deterministic point estimate (defaults: fixed->value,
#  loguniform->geometric mean, uniform->midpoint, normal->mean).
# =====================================================================
run:
  n_samples: 1000000
  seed: 20261001
  chunk: 1000            # samples per vectorised block
  dt_gyr: 0.02           # time-grid resolution
  t_now_gyr: 13.8        # present age of the Universe / Galaxy grid end
  earth_habitable_start_gya: 4.4   # oceans formed (Peck et al. 2001 via Snyder-Beattie+2021 Table 1)
  bayes_update_on_earth_timing: true   # Snyder-Beattie et al. 2021-style update of hard-step rates
  scenarios_to_run: [baseline, baseline_no_exomoons, snyder_beattie_priors, user_inputs, user_fast_intelligence, similarity_weighted, similarity_weighted_no_rare_earth, earth_random_draw, nathan_headline, nathan_headline_no_superhab, nathan_headline_no_tooluse]
  headline_scenario: nathan_headline        # user-approved headline (Oct 2026); weekly routine reports this first
  literature_baseline: baseline            # kept for comparison in every report

# ---------------- Astrophysics / galaxy -------------------------------
params:
  sfr_now:            {dist: normal, mean: 1.65, sd: 0.19, min: 0.5, unit: "Msun/yr",
                       source: "Licquia & Newman 2015, ApJ 806, 96", url: "https://arxiv.org/abs/1407.1078"}
  m_disk_now:         {dist: normal, mean: 5.17e10, sd: 1.11e10, min: 2.0e10, unit: "Msun (disk stellar mass today)",
                       source: "Licquia & Newman 2015", url: "https://arxiv.org/abs/1407.1078"}
  return_fraction:    {dist: uniform, low: 0.27, high: 0.41, unit: "-",
                       source: "Madau & Dickinson 2014 ARA&A (R=0.27 Salpeter, 0.41 Chabrier)", url: "https://ned.ipac.caltech.edu/level5/March14/Madau/paper.pdf"}
  f_early_disk_mass:  {dist: uniform, low: 0.4, high: 0.6, unit: "fraction of disk mass formed 13.0-8.5 Gyr ago (thick-disk phase)",
                       source: "Snaith et al. 2015 A&A 578, A87 ('roughly half the stellar mass in first 4-5 Gyr')", url: "https://www.aanda.org/articles/aa/full_html/2015/06/aa24281-14/aa24281-14.html"}
  disk_start_gyr:     {dist: fixed, value: 0.8, unit: "Gyr after Big Bang (13.0 Gyr ago)", source: "Snaith et al. 2015 (thick disk 9-13 Gyr ago)", url: "https://www.aanda.org/articles/aa/full_html/2015/06/aa24281-14/aa24281-14.html"}
  thick_end_gyr:      {dist: fixed, value: 5.3, unit: "Gyr after Big Bang (8.5 Gyr ago)", source: "Snaith et al. 2015 (sharp SFR drop ~8-9 Gyr ago)", url: "https://www.aanda.org/articles/aa/full_html/2015/06/aa24281-14/aa24281-14.html"}
  stars_per_msun:     {dist: uniform, low: 1.6, high: 2.8, best: 1.64, unit: "stars per Msun formed",
                       source: "Kroupa 2001 IMF: 1.64 H-burning stars/Msun (integrated here); 2.8 = 1/0.36 incl. brown dwarfs", url: "https://adsabs.harvard.edu/pdf/2001mnras.322..231k"}
  f_gk:               {dist: uniform, low: 0.10, high: 0.17, unit: "fraction of stars that are G/K",
                       source: "RECONS 10-pc census (G 5.0% + K 11.6%); Kroupa IMF 0.6-1.1 Msun = 10%", url: "http://www.recons.org/census.posted.htm"}
  f_m:                {dist: uniform, low: 0.75, high: 0.81, unit: "fraction of stars that are M dwarfs",
                       source: "RECONS 10-pc census (75%); Kroupa IMF 0.08-0.6 Msun = 81%", url: "http://www.recons.org/census.posted.htm"}
  fp:                 {dist: fixed, value: 1.0, unit: "-", note: "folded into ne (eta-Earth values are per star)",
                       source: "Cassan et al. 2012 Nature 481, 167 (>=1 bound planet per star)", url: "https://www.nature.com/articles/nature10684"}
  ne_gk:              {dist: loguniform, low: 0.10, high: 0.88, best: 0.35, unit: "rocky HZ planets per G/K star (fp folded in)",
                       source: "Bryson+2021 AJ 161, 36 (G-mid-K: 0.37-0.60 conservative, 0.58-0.88 optimistic); 2026 Astronomy & Computing reanalysis of 4,510 Archive transit planets: K ~0.27, F/G ~0.10 (schematic). best = K-weighted (K:G ~2:1 by number, RECONS)",
                       url: "https://arxiv.org/abs/2010.14812 ; https://astrobiology.com/2026/08/06/quantifying-detection-bias-and-recovering-habitable-zone-occurrence-rates-in-the-nasa-exoplanet-archive/"}
  ne_m:               {dist: loguniform, low: 0.16, high: 0.41, best: 0.24, unit: "Earth-size HZ planets per M dwarf (before the M-dwarf habitability penalties)",
                       source: "Dressing & Charbonneau 2015 ApJ 807, 45 (0.16 conservative, 0.24 broad HZ); 2026 Astronomy & Computing Archive reanalysis (M ~0.41, completeness-corrected; raw 4.03%)",
                       url: "https://arxiv.org/abs/1501.01623 ; https://astrobiology.com/2026/08/06/quantifying-detection-bias-and-recovering-habitable-zone-occurrence-rates-in-the-nasa-exoplanet-archive/"}
  f_m_habitable:      {dist: loguniform, low: 0.03, high: 1.0, unit: "M-dwarf penalty for tidal locking + pre-main-sequence water loss (flares are separate, see multipliers.f_m_flares)",
                       source: "ASSUMED bracket informed by Shields+2016 Phys.Rep.; Luger & Barnes 2015; Lingam & Loeb 2018 JCAP; Haqq-Misra+2018 IJA; Snyder-Beattie+2021 prediction",
                       url: "https://arxiv.org/abs/1610.05765"}
  th_gk_gyr:          {dist: loguniform, low: 5.0, high: 20.0, best: 7.0, unit: "Gyr habitable window for complex life (G/K)",
                       source: "Rushby et al. 2013 Astrobiology (Earth HZ lifetime 6.29-7.79 Gyr; K dwarfs longer); Earth biosphere ends 0.8-1.5 Ga from now (Caldeira & Kasting 1992 via Snyder-Beattie+2021)", url: "https://research-repository.st-andrews.ac.uk/handle/10023/5071"}
  th_m_gyr:           {dist: loguniform, low: 10.0, high: 50.0, best: 20.0, unit: "Gyr habitable window (M dwarfs)",
                       source: "Rushby et al. 2013 (HZ lifetimes up to 54.7 Gyr)", url: "https://research-repository.st-andrews.ac.uk/handle/10023/5071"}
  f_ghz:              {dist: loguniform, low: 0.1, high: 1.0, unit: "spatial fraction of disk stars in Galactic Habitable Zone",
                       source: "Lineweaver, Fenner & Gibson 2004 Science (<10% incl. time/metallicity cuts); Prantzos 2008 SSRv (whole disk by now); Gowanlock+2011 (1.2% incl. more factors)", url: "https://arxiv.org/abs/astro-ph/0401024"}
  t_metal_gyr:        {dist: uniform, low: 1.0, high: 3.0, unit: "Gyr after Big Bang when Earth-forming metallicity is reached (logistic midpoint, width 0.5 Gyr)",
                       source: "ASSUMED; informed by Lineweaver 2001 Icarus (metallicity selection; Earths avg 1.8+/-0.9 Gyr older than Earth) and Zackrisson+2016 ApJ 833, 214", url: "https://ui.adsabs.harvard.edu/abs/2001Icar..151..307L/abstract"}
  # -------- habitable exomoons (additional habitable bodies alongside ne) --------
  n_giant_hz_gk:      {dist: uniform, low: 0.065, high: 0.115, unit: "giant planets (3-25 R_earth) in optimistic HZ per G/K star",
                       source: "Hill et al. 2018 ApJ 860, 6 (G 6.5+/-1.9%, K 11.5+/-3.1%)", url: "https://arxiv.org/abs/1805.03370"}
  n_giant_hz_m:       {dist: loguniform, low: 0.01, high: 0.12, best: 0.06, unit: "giant planets in optimistic HZ per M dwarf",
                       source: "Hill et al. 2018 (M 6+/-6%); lower bound 0.01 ASSUMED", url: "https://arxiv.org/abs/1805.03370"}
  f_exomoon_host:     {dist: loguniform, low: 1.0e-4, high: 1.0, unit: "fraction of HZ giants hosting a >~0.1-0.3 M_earth (atmosphere-retaining) moon",
                       source: "WIDE ASSUMED prior. Low end: Canup & Ward 2006 Nature (satellite systems ~1e-4 of planet mass -> in-situ moons Moon-to-Mars size); capture routes Williams 2013 Astrobiology, Porter & Grundy 2011 ApJL (~half of captured orbits circularise); Kepler-1625b-i (Teachey & Kipping 2018) and Kepler-1708b-i (Kipping+2022) candidates contested (Heller+2023, arXiv:2312.03786). High end: Hill+2018 'one large moon per giant' case",
                       url: "https://www.nature.com/articles/nature04860"}
  f_exomoon_habitable: {dist: loguniform, low: 0.1, high: 1.0, unit: "fraction of such moons outside the tidal/illumination 'habitable edge'",
                       source: "ASSUMED range; Heller & Barnes 2013 Astrobiology 13, 18 (habitable edge; tidal heating can sterilise); Williams, Kasting & Wade 1997 Nature 385, 234 (habitable moons concept)",
                       url: "https://arxiv.org/abs/1209.5323"}
  # -------- hazards / resetting events --------
  r_ster0_per_gyr:    {dist: loguniform, low: 1.0e-3, high: 0.25, unit: "per Gyr, whole-biosphere sterilisation rate today (scaled by SFR(t)/SFR_now in the past)",
                       source: "ASSUMED; upper bound: Earth's biosphere unsterilised for ~4 Gyr; SFR scaling motivated by Piran & Jimenez 2014 PRL (GRB hazard higher in early Universe)", url: "https://arxiv.org/abs/1409.2506"}
  r_bigfive_per_gyr:  {dist: uniform, low: 9.3, high: 10.6, unit: "per Gyr, Big-Five-class mass extinctions (Earth analog)",
                       source: "Big Five at ~444, 372, 252, 201, 66 Ma (US NPS / geologic time scale): intervals 72,120,51,135 Myr (mean 94.5 Myr => 10.6/Gyr); 5 events in 539 Myr Phanerozoic => 9.3/Gyr; Raup & Sepkoski 1982",
                       url: "https://www.nps.gov/subjects/fossils/mass-extinctions-through-geologic-time.htm"}
  p_bigfive_kills_toolusers: {dist: loguniform, low: 0.1, high: 1.0, unit: "probability a Big-Five-class event ends a widespread tool-using lineage",
                       source: "ASSUMED (mammals, birds and many large clades survived each Big Five event)", url: "https://www.science.org/doi/10.1126/science.215.4539.1501"}
  r_self_per_gyr:     {dist: loguniform, low: 0.1, high: 100.0, best: 3.0, unit: "per Gyr, self-inflicted / technological end-of-lineage hazard (mean 10 Myr to 10 Gyr), averaged over the whole stone-age-or-later phase",
                       source: "ASSUMED, no galactic data. Earth-only context (NOT used as galactic L): Urban 2024 Science (climate threatens 7.6% of species avg; 1.6% at ~1.3 C; ~1/3 at highest emissions); Ceballos & Ehrlich 2023 PNAS (73 tetrapod genera lost since 1500, ~35x background) vs PLOS Biol 2025 (102 genera, rare & decelerating)",
                       url: "https://www.science.org/doi/10.1126/science.adp4461"}
  r_grb_per_gyr:      {dist: uniform, low: 0.46, high: 1.4, unit: "per Gyr today at solar radius, ozone-destroying (complex-life-lethal) long GRBs",
                       source: "Piran & Jimenez 2014 PRL (>90% in 5 Gyr => >=0.46/Gyr; 50% in 500 Myr => 1.4/Gyr)", url: "https://arxiv.org/abs/1409.2506"}
  r_sn_per_gyr:       {dist: fixed, value: 1.5, unit: "per Gyr, core-collapse SNe within 8 pc",
                       source: "Gehrels et al. 2003 ApJ 585, 1169 (1.5/Gyr; ~doubles biologically active UV)", url: "https://arxiv.org/abs/astro-ph/0211361"}
  p_lethal_astro:     {dist: loguniform, low: 0.1, high: 1.0, unit: "probability a GRB/SN event actually ends a tool-using lineage",
                       source: "ASSUMED (Gehrels+2003 note SN pathway 'may be less important than previously thought')", url: "https://arxiv.org/abs/astro-ph/0211361"}
  # -------- stone-age phase duration & recurrence --------
  l_stone_yr:         {dist: loguniform, low: 1.0e4, high: 1.0e9, best: 6.6e6, unit: "yr, intrinsic (background, non-catastrophic, non-self-inflicted) duration of the stone-age-or-later phase",
                       source: "Earth: >=3.3 Myr so far (Harmand+2015 Nature); Gott 1993 Copernican estimate (best = 2x elapsed); chimp stone age >=4.3 kyr (Mercader+2007 PNAS); SDO 2018 L upper ~1e9-1e10", url: "https://www.nature.com/articles/nature14464"}
  m_recurrence:       {dist: loguniform, low: 0.01, high: 1.0, unit: "expected re-evolution time of tool use after loss, as a multiple of the intelligence step's tau",
                       source: "ASSUMED (no quantitative literature); multiple independent stone-tool lineages on Earth (Mercader+2007) suggest re-evolution can be easier than the first time", url: "https://www.pnas.org/doi/10.1073/pnas.0607909104"}

# ---------------- Planetary "Rare-Earth" multipliers ------------------
# effective factor = fraction of otherwise-habitable planets that pass the requirement
# applies_to: gk / m (2-class v1 scenarios); in multispectral scenarios gk -> K,G,F and m -> M; K / G / F / M = single class
# (upper bound 1 = requirement not actually needed).
multipliers:
  f_plate_tectonics:  {dist: loguniform, low: 0.01, high: 1.0, best: 0.17, applies_to: [gk, m],
                       source: "Stern & Gerya 2024 Sci.Rep. (f_pt < 0.17); Valencia+2007 ApJL ('inevitable' on super-Earths) vs O'Neill & Lenardic 2007 GRL (stagnant lid); Stern 2016 GSF",
                       url: "https://www.nature.com/articles/s41598-024-54700-x"}
  f_land_and_ocean:   {dist: loguniform, low: 2.0e-4, high: 1.0, applies_to: [gk, m],
                       source: "Stern & Gerya 2024 (f_oc 0.0002-0.01); Simpson 2017 MNRAS (most HZ worlds >90% ocean); stone tools need dry land",
                       url: "https://arxiv.org/abs/1607.03095"}
  f_large_moon:       {dist: loguniform, low: 0.022, high: 1.0, applies_to: [gk, m], applies_to_exomoons: false,
                       source: "Elser+2011 Icarus (massive moon for ~1/12 of terrestrial planets, range 1/45-1/4); Laskar+1993 vs Lissauer, Barnes & Chambers 2012 Icarus (moonless obliquity mostly modest -> moon may not be needed)",
                       url: "https://arxiv.org/abs/1105.4616"}
  f_jupiter_shield:   {dist: loguniform, low: 0.067, high: 1.0, applies_to: [gk, m], applies_to_exomoons: false,
                       source: "Wittenmyer+2020 MNRAS (cool Jupiters around 6.73% of stars); Horner & Jones 2008 IJA (shield role ambiguous -> may not be needed)",
                       url: "https://arxiv.org/abs/1912.01821"}

  f_binary_ok:        {dist: uniform, low: 0.8, high: 1.0, applies_to: [gk, m],
                       source: "Kraus+2016 AJ 152, 8 (close binaries <47 AU suppress planets; ~1/5 of solar-type stars disallowed); Raghavan+2010 ApJS (54% single). Upper bound 1 because Kepler eta-Earth may already include binaries",
                       url: "https://arxiv.org/abs/1604.05744"}
  f_m_flares:         {dist: loguniform, low: 0.03, high: 1.0, applies_to: [m],
                       source: "ASSUMED bracket; flare/XUV/proton-event ozone & atmosphere erosion reviewed in Shields+2016 Phys.Rep.; Tilley+2019 (arXiv:1711.08484); Lingam & Loeb 2018",
                       url: "https://arxiv.org/abs/1610.05765"}
  f_k_activity:       {dist: loguniform, low: 0.5, high: 1.0, applies_to: [K], multispectral_only: true,
                       source: "ASSUMED mild K-dwarf penalty (late-K flares/XUV and possible HZ tidal locking). Cuntz & Guinan 2016 ApJ 827, 79 (K dwarfs: favourable hosts, far lower activity than M dwarfs); Barnes 2017 Celest.Mech.Dyn.Astr. 129, 509 (HZ planets of low-mass stars can tidally lock within ~1 Gyr)",
                       url: "https://iopscience.iop.org/article/10.3847/0004-637X/827/1/79 ; https://link.springer.com/article/10.1007/s10569-017-9783-7"}
  f_f_uv:             {dist: loguniform, low: 0.14, high: 1.0, applies_to: [F], multispectral_only: true,
                       source: "ASSUMED mapping of Sato et al. 2014 Int.J.Astrobiol. 13, 244 (F0-F8 V, 1.2-1.5 Msun: DNA damage at Earth-equivalent orbits 2.5-7.1x solar without atmospheric attenuation, much less with it): survival fraction 1/7.1 .. 1",
                       url: "https://arxiv.org/abs/1312.7431"}
  extra_worlds_per_system:  {dist: one_plus_loguniform, low: 1.0e-3, high: 0.1, applies_to: [gk, m], scenarios: [user_inputs, user_fast_intelligence],
                       source: "USER-PROPOSED (speculative past intelligence on Venus/Mars): low-weight bonus for >1 tool-using world per system; not literature",
                       url: "user research export"}

# ---------------- Multi-spectral host classes (v2; used by scenarios with `multispectral: true`)
# Replaces the 2-class (G/K, M) parameters listed in replaces_params with per-class ones named
# f_star_<C>, ne_<C>, th_<C>_gyr, n_giant_hz_<C>. Rare-Earth multipliers with applies_to [gk] act on K, G, F; [m] on M.
# Similarity weights: each class bootstraps its own Archive HZ-rocky ESI list (>= min_n_by_type planets) else the pooled list.
# Superhabitability boost applies to K-class planets only (Schulze-Makuch+2020 criteria).
star_classes:
  replaces_params: [f_gk, f_m, ne_gk, ne_m, th_gk_gyr, th_m_gyr, n_giant_hz_gk, n_giant_hz_m]
  superhab_classes: [K]
  mass_bins_note: "Approximate main-sequence mass bins used for the Kroupa-IMF fractions: M 0.08-0.6, K 0.6-0.9, G 0.9-1.1, F 1.1-1.5 Msun (ASSUMED boundaries). Archive Teff bins (hz_archive.py, esi.py): M 2300-3900, K 3900-5200, G 5200-6000, F 6000-7200 K."
  recons_source: "RECONS 10-pc census as of 2018-04-12 (378 stars): M 283 (74.9%), K 44 (11.6%), G 19 (5.0%), F 7 (1.85%), A 4, white dwarfs 21"
  classes:
    M:
      f_star:     {dist: uniform, low: 0.749, high: 0.811, unit: "fraction of stars formed that are M dwarfs",
                   source: "RECONS 10-pc census 283/378 = 0.749; Kroupa 2001 IMF number fraction 0.08-0.6 Msun = 0.811 (integrated here)", url: "http://www.recons.org/census.posted.htm"}
      ne:         {dist: loguniform, low: 0.16, high: 0.41, best: 0.24, unit: "Earth-size HZ planets per M dwarf",
                   source: "Dressing & Charbonneau 2015 ApJ 807, 45 (0.16 conservative, 0.24 broad HZ); 2026 Astronomy & Computing Archive reanalysis (M ~0.41)", url: "https://arxiv.org/abs/1501.01623"}
      th_gyr:     {dist: loguniform, low: 10.0, high: 50.0, best: 20.0, unit: "Gyr habitable window", source: "Rushby et al. 2013 Astrobiology 13, 833 (HZ lifetimes up to 54.7 Gyr)", url: "https://research-repository.st-andrews.ac.uk/handle/10023/5071"}
      n_giant_hz: {dist: loguniform, low: 0.01, high: 0.12, best: 0.06, unit: "HZ giants per star (exomoon hosts)", source: "Hill et al. 2018 ApJ 860, 67 Table: M 6.0+/-6.0%; lower bound 0.01 ASSUMED", url: "https://arxiv.org/abs/1805.03370"}
      penalty_params: [f_m_habitable]      # tidal locking + pre-main-sequence water loss (params.f_m_habitable); flares = multipliers.f_m_flares
    K:
      f_star:     {dist: uniform, low: 0.077, high: 0.116, unit: "fraction of stars formed that are K dwarfs",
                   source: "Kroupa 2001 IMF 0.6-0.9 Msun = 0.077 (integrated here); RECONS 44/378 = 0.116", url: "http://www.recons.org/census.posted.htm"}
      ne:         {dist: loguniform, low: 0.27, high: 0.88, best: 0.49, unit: "rocky HZ planets per K dwarf",
                   source: "2026 Astronomy & Computing Archive reanalysis K ~0.27 (low); Bryson+2021 AJ 161, 36 G-mid-K 0.37-0.60 conservative / 0.58-0.88 optimistic (high)", url: "https://arxiv.org/abs/2010.14812 ; https://astrobiology.com/2026/08/06/quantifying-detection-bias-and-recovering-habitable-zone-occurrence-rates-in-the-nasa-exoplanet-archive/"}
      th_gyr:     {dist: loguniform, low: 8.0, high: 30.0, best: 15.0, unit: "Gyr habitable window",
                   source: "ASSUMED bracket informed by Rushby+2013 (Earth 6.29-7.79 Gyr; K/M hosts longer because of slower HZ migration; Kepler candidates up to 18.8 Gyr)", url: "https://research-repository.st-andrews.ac.uk/handle/10023/5071"}
      n_giant_hz: {dist: uniform, low: 0.084, high: 0.146, unit: "HZ giants per star", source: "Hill et al. 2018: K 11.5+/-3.1% (+/-1 sigma)", url: "https://arxiv.org/abs/1805.03370"}
      penalty_params: []                   # K activity/tidal penalty = multipliers.f_k_activity
    G:
      f_star:     {dist: uniform, low: 0.026, high: 0.050, unit: "fraction of stars formed that are G dwarfs",
                   source: "Kroupa 2001 IMF 0.9-1.1 Msun = 0.026 (integrated here); RECONS 19/378 = 0.050", url: "http://www.recons.org/census.posted.htm"}
      ne:         {dist: loguniform, low: 0.10, high: 0.88, best: 0.30, unit: "rocky HZ planets per G dwarf",
                   source: "2026 Astronomy & Computing Archive reanalysis F/G ~0.10 (low); Bryson+2021 G-mid-K up to 0.88 optimistic (high)", url: "https://arxiv.org/abs/2010.14812"}
      th_gyr:     {dist: loguniform, low: 5.0, high: 10.0, best: 6.5, unit: "Gyr habitable window",
                   source: "Rushby+2013 (Earth HZ lifetime 6.29-7.79 Gyr); Earth biosphere ends 0.8-1.5 Ga from now (Caldeira & Kasting 1992 via Snyder-Beattie+2021)", url: "https://research-repository.st-andrews.ac.uk/handle/10023/5071"}
      n_giant_hz: {dist: uniform, low: 0.046, high: 0.084, unit: "HZ giants per star", source: "Hill et al. 2018: G 6.5+/-1.9% (+/-1 sigma)", url: "https://arxiv.org/abs/1805.03370"}
      penalty_params: []
    F:
      f_star:     {dist: uniform, low: 0.0185, high: 0.0285, unit: "fraction of stars formed that are F dwarfs",
                   source: "RECONS 7/378 = 0.0185 (present day; some F stars have already died); Kroupa 2001 IMF 1.1-1.5 Msun = 0.0285 (integrated here)", url: "http://www.recons.org/census.posted.htm"}
      ne:         {dist: loguniform, low: 0.03, high: 0.60, best: 0.10, unit: "rocky HZ planets per F dwarf",
                   source: "2026 Archive reanalysis F/G ~0.10 (best); Bryson+2021 sample extends only to 6300 K (upper 0.60 = its conservative upper bound); low 0.03 ASSUMED (poor Kepler completeness for F hosts)", url: "https://arxiv.org/abs/2010.14812"}
      th_gyr:     {dist: loguniform, low: 1.5, high: 5.0, best: 2.7, unit: "Gyr habitable window",
                   source: "ASSUMED; F stars (1.2-1.5 Msun) have short main-sequence lifetimes that constrain habitability (Sato et al. 2014 Int.J.Astrobiol. 13, 244); Rushby+2013 only modelled 0.2-1.2 Msun", url: "https://arxiv.org/abs/1312.7431"}
      n_giant_hz: {dist: uniform, low: 0.046, high: 0.084, unit: "HZ giants per star", source: "ASSUMED = G value (Hill et al. 2018 report no F-star rate)", url: "https://arxiv.org/abs/1805.03370"}
      penalty_params: []                   # UV penalty = multipliers.f_f_uv

# ---------------- Multiphase civilisation stages (v2; used by scenarios with `multiphase: true`)
# Inside each tool-using (stone-age-or-greater) episode a world moves lithic -> agricultural -> industrial -> radio -> spacefaring.
# Advance s->s+1 at rate 1/tau; stage collapse hazard h (stages 2-5), a fraction q regresses one stage (can recur later), 1-q ends
# the lineage. The baseline end-of-lineage rate (L_stone, Big-Five, GRB/SN, r_self) applies in every stage. Earth anchors are the best values.
multiphase:
  stages: [lithic, agricultural, industrial, radio, spacefaring]
  stage_definitions:
    lithic: "habitual stone-tool making (Lomekwi 3, 3.3 Ma; Harmand+2015)"
    agricultural: "farming / sedentary food production (Near East management of wild crops and livestock by >=11,500 cal BP; Zeder 2011)"
    industrial: "fossil-fuel / machine industry (Industrial Revolution, ~1760 CE)"
    radio: "radio-capable: can transmit/receive interstellar-detectable radio (Marconi 1895; SETI-style 'communicating' stage)"
    spacefaring: "orbital spaceflight capability (Sputnik 1, 1957). Self-sustaining off-world settlement is NOT required (Earth has not reached it)"
  advance_params: [stage_tau_agri_yr, stage_tau_ind_yr, stage_tau_radio_yr, stage_tau_space_yr]
  hazard_params: [stage_h_agri_per_yr, stage_h_ind_per_yr, stage_h_radio_per_yr, stage_h_space_per_yr]
  regress_fraction_param: stage_q_regress
  params:
    stage_tau_agri_yr:  {dist: loguniform, low: 3.3e5, high: 3.3e7, best: 3.29e6, unit: "yr, expected time lithic -> agricultural",
                         source: "Earth anchor 3.3 Ma (Harmand+2015 Lomekwi 3) -> ~11.5 ka (Zeder 2011 Curr.Anthropol. 52, S221) = 3.29 Myr; range = Earth/10 .. Earth x10 ASSUMED",
                         url: "https://www.nature.com/articles/nature14464 ; https://doi.org/10.1086/659307"}
    stage_tau_ind_yr:   {dist: loguniform, low: 1.1e3, high: 1.1e5, best: 1.1e4, unit: "yr, expected time agricultural -> industrial",
                         source: "Earth anchor ~11.5 ka -> ~1760 CE (~11.2 kyr); range Earth/10 .. x10 ASSUMED",
                         url: "https://doi.org/10.1086/659307 ; https://www.britannica.com/event/Industrial-Revolution"}
    stage_tau_radio_yr: {dist: loguniform, low: 14.0, high: 1400.0, best: 135.0, unit: "yr, expected time industrial -> radio-capable",
                         source: "Earth anchor ~1760 -> 1895 (Marconi's first radio transmissions) = ~135 yr (user: ~150 yr); range Earth/10 .. x10 ASSUMED",
                         url: "https://www.britannica.com/biography/Guglielmo-Marconi"}
    stage_tau_space_yr: {dist: loguniform, low: 6.2, high: 620.0, best: 62.0, unit: "yr, expected time radio -> spacefaring (orbital spaceflight)",
                         source: "Earth anchor 1895 -> 1957 (Sputnik 1) = 62 yr; range Earth/10 .. x10 ASSUMED",
                         url: "https://www.nasa.gov/history/sputnik/"}
    stage_h_agri_per_yr:  {dist: loguniform, low: 1.0e-7, high: 1.0e-3, unit: "per yr, world-wide collapse hazard of the agricultural stage",
                         source: "ASSUMED. Earth: farming has persisted ~11.5 kyr world-wide despite many regional collapses (Tainter 1988, The Collapse of Complex Societies); one world gives no galactic rate",
                         url: "https://doi.org/10.1086/659307"}
    stage_h_ind_per_yr:   {dist: loguniform, low: 1.0e-6, high: 1.0e-2, unit: "per yr, world-wide collapse hazard of the industrial stage",
                         source: "ASSUMED (Earth: ~265 yr industrial so far). Natural extinction alone is < 6.9e-5/yr (Snyder-Beattie, Ord & Bonsall 2019 Sci.Rep. 9, 11054), so most of this range is anthropogenic risk, which that bound does not cover",
                         url: "https://www.nature.com/articles/s41598-019-47540-7"}
    stage_h_radio_per_yr: {dist: loguniform, low: 1.0e-10, high: 1.0e-2, unit: "per yr, collapse hazard of the radio-capable stage",
                         source: "1/L with L log-uniform 1e2 .. 1e10 yr = Sandberg, Drexler & Ord 2018 Table 1 (lifetime of a detectable civilisation)",
                         url: "https://arxiv.org/abs/1806.02404"}
    stage_h_space_per_yr: {dist: loguniform, low: 1.0e-10, high: 1.0e-2, unit: "per yr, collapse hazard of the spacefaring stage",
                         source: "Same as radio stage (SDO 2018 L 1e2 .. 1e10 yr); ASSUMED that orbital capability does not by itself lower the hazard",
                         url: "https://arxiv.org/abs/1806.02404"}
    stage_q_regress:    {dist: uniform, low: 0.0, high: 1.0, unit: "fraction of stage collapses that regress one stage (and can recur) instead of ending the tool-using lineage",
                         source: "ASSUMED (no quantitative literature). Earth's regional collapses mostly regressed rather than ended lineages (Tainter 1988)",
                         url: "https://www.cambridge.org/core/books/collapse-of-complex-societies/"}

# ---------------- Biological hard steps (Carter 1983 / Hanson 1998 / Watson 2008 / Snyder-Beattie+2021)
# Each step is a Poisson process with expected time tau (Gyr). tau prior is set per scenario.
# earth_gya = when the step completed on Earth (used for the Bayesian timing update).
hard_steps:
  - {name: abiogenesis,             earth_gya: 3.9,    source: "Snyder-Beattie+2021 Table 1 (3.5->4.1 Gya range)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7997718/"}
  - {name: oxygenic_photosynthesis_GOE, earth_gya: 2.4, source: "Lyons, Reinhard & Planavsky 2014 Nature (GOE ~2.4-2.3 Ga)", url: "https://www.nature.com/articles/nature13068"}
  - {name: eukaryogenesis,          earth_gya: 1.84,   source: "Betts+2018 via Snyder-Beattie+2021 Table 1 (<1.84 Ga)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7997718/"}
  - {name: complex_multicellularity, earth_gya: 0.6,   source: "Knoll 2011 Annu.Rev.EPS (animal complex multicellularity, Ediacaran)", url: "https://www.annualreviews.org/content/journals/10.1146/annurev.earth.031208.100209"}
  - {name: stone_tool_intelligence, earth_gya: 0.0033, source: "Harmand+2015 Nature (Lomekwi 3, 3.3 Ma)", url: "https://www.nature.com/articles/nature14464"}

scenarios:
  baseline:
    multispectral: true      # v2: M/K/G/F host classes
    multiphase: true         # v2: civilisation stages
    description: "Hard-step expected times log-uniform 1e-3..1e3 Gyr (6 decades centred on Earth's ~1 Gyr transition timescale), updated on Earth's fossil-record timing."
    hard_step_tau: {dist: loguniform, low: 1.0e-3, high: 1.0e3}
  snyder_beattie_priors:
    description: "Snyder-Beattie+2021 priors: log-uniform from bacterial doubling time (1e-14 Gyr) to 1e10 Gyr, updated on Earth timing."
    hard_step_tau: {dist: loguniform, low: 1.0e-14, high: 1.0e10}

  user_inputs:
    description: "USER scenario: Nathan's stated assumptions (stone-age-or-better lifetime/extinction window 50-200 kyr; Sun ~4 Gyr remaining => G/K window ~8.5 Gyr; low-weight multi-world-per-system bonus); all missing factors = literature baseline."
    hard_step_tau: {dist: loguniform, low: 1.0e-3, high: 1.0e3}
    overrides:
      l_stone_yr: {dist: loguniform, low: 5.0e4, high: 2.0e5, best: 1.0e5, source: "USER-PROPOSED 50-200 kyr extinction window (CONFLICTS with Big-Five spacing of ~50-135 Myr; kept as the user's scenario)"}
      th_gk_gyr:  {dist: uniform, low: 7.5, high: 9.5, best: 8.4, source: "USER: Sun ~4 Gyr remaining (+~4.4 Gyr elapsed)"}
  user_fast_intelligence:
    description: "USER variant: also adopt the user's 'tens of thousands of years' time-to-intelligence for the final step (tau 1e4-1e5 yr). Earth's 0.6 Gyr multicellularity->tools gap essentially rules this out, so the Earth-timing update is switched OFF here (otherwise weights ~0)."
    hard_step_tau: {dist: loguniform, low: 1.0e-3, high: 1.0e3}
    bayes_update: false
    overrides:
      l_stone_yr: {dist: loguniform, low: 5.0e4, high: 2.0e5, best: 1.0e5}
      th_gk_gyr:  {dist: uniform, low: 7.5, high: 9.5, best: 8.4}
      tau_stone_tool_intelligence: {dist: loguniform, low: 1.0e-5, high: 1.0e-4, best: 3.0e-5}

  similarity_weighted:
    description: "USER-PROPOSED argument (Nathan): treat known Earth-like planets as sharing Earth's 'average data' (like electrons), scaled by similarity. Every habitable body gets Earth's observed step timeline as its TYPICAL case (each hard step's expected time = Earth's observed interval; no Earth-timing/observer-selection reweighting toward slow/rare steps) and its per-body probability is multiplied by w = ESI^k, averaged over the NASA Exoplanet Archive HZ-rocky ESI distribution (bootstrap per sample). Rare-Earth multipliers kept (ESI does not measure tectonics/land/moon)."
    hard_step_tau: {dist: earth_interval}
    bayes_update: false
    similarity:
      esi_file: data/esi_hz.json          # written by esi.py (Schulze-Makuch+2011 4-property ESI)
      population: conservative            # Kopparapu+2014 conservative HZ, R<1.8 R_earth, Teff>=2600 K clamp (26 planets); optimistic (41) stored as aux
      exponents: [1, 2, 3, 5, 10]         # similarity -> probability map p = ESI^k (monotonic); k=1 linear, larger k = steeper
      headline_exponent: 1
      source: "Schulze-Makuch et al. 2011 Astrobiology 11, 1041 (ESI); PHL weights table"
      url: "https://phl.upr.edu/projects/earth-similarity-index-esi"
  nathan_headline:
    multispectral: true      # v2: M/K/G/F host classes
    multiphase: true         # v2: civilisation stages
    description: "NATHAN'S HEADLINE (user-approved). similarity_weighted (ESI^1, conservative HZ, Earth's step timeline as typical, no observer-selection reweighting) PLUS (a) superhabitability boost for the qualifying fraction of G/K planets (Schulze-Makuch, Heller & Guinan 2020) and (b) cross-lineage tool use: the complex-animals->stone-tools step is fast/repeatable (Earth's 0.597 Gyr interval divided by the number of independent tool-use origins; recurrence after loss scales with the shorter time). Earlier hard steps unchanged."
    hard_step_tau: {dist: earth_interval}
    bayes_update: false
    similarity:
      esi_file: data/esi_hz.json
      population: conservative
      exponents: [1, 2, 3, 5, 10]
      headline_exponent: 1
      min_n_by_type: 3                    # per-type ESI list used if >= 3 planets (M 22, K 3); G (1) and F (0) use the pooled list
    extra_params:
      f_superhab:     {dist: loguniform, low: 0.03, high: 0.43, best: 0.104, unit: "fraction of K-dwarf habitable planets meeting the superhabitable criteria (~1.0-1.5 R_earth, ~5 K warmer); age 5-8 Gyr is handled by the time model; applied to K hosts only",
                       source: "ASSUMED bracket around an Archive-derived 0.104 = P(1.0<=R<=1.5 given HZ, R<2) 25/49 x P(T_surf 282-302 K given HZ, R<2) 10/49 (superhab.py; independence assumed). (v1 used 0.073 = 0.104 x K share 0.70 of G/K.) Criteria: Schulze-Makuch, Heller & Guinan 2020 Astrobiology 20, 1394 Table 2",
                       url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7757576/"}
      superhab_boost: {dist: loguniform, low: 1.0, high: 3.0, best: 1.73, unit: "multiplier (>1) on the per-planet step-success probability for superhabitable planets (capped so probability <= 1)",
                       source: "ASSUMED (user-suggested 1-3x). Schulze-Makuch+2020 and Heller & Armstrong 2014 (Astrobiology 14, 50) argue qualitatively for higher habitability/biomass but give no numeric factor",
                       url: "https://doi.org/10.1089/ast.2013.1088"}
      n_tool_origins: {dist: loguniform, low: 3.0, high: 7.0, best: 6.0, unit: "effective number of independent origins of tool use among complex animals on Earth; tau_stone_tool_intelligence = 0.5967 Gyr (Earth's multicellularity->stone-tools interval) / n",
                       source: "Low 3 = independent lithic-flake-producing primate lineages (hominins, Harmand+2015; bearded capuchins, Proffitt+2016 Nature 539, 85; long-tailed macaques, Proffitt+2023 Sci.Adv. 9, eade8159). Best 6 = the user's list, each verified: primates (Goodall 1964 Nature 201, 1264), corvids (Hunt 1996 Nature 379, 249), octopus (Finn, Tregenza & Norman 2009 Curr.Biol. 19, R1069), sea otters (Hall & Schaller 1964 J.Mammal. 45, 287), dolphins (Kruetzen+2005 PNAS 102, 8939), elephants (Hart+2001 Anim.Behav. 62, 839). High 7 = classes with documented tool use (Bentley-Condit & Smith 2010 Behaviour 147, 185: three phyla, seven classes). Mapping origins -> Poisson rate (n events in ~0.6 Gyr => expected first-origin time 0.6/n Gyr) is ASSUMED",
                       url: "https://doi.org/10.1038/nature20112 ; https://www.science.org/doi/10.1126/sciadv.ade8159 ; https://brill.com/view/journals/beh/147/2/article-p185_3.xml"}
  nathan_headline_no_superhab:
    multispectral: true      # v2: M/K/G/F host classes
    multiphase: true         # v2: civilisation stages
    description: "Sensitivity: nathan_headline without the superhabitability boost (cross-lineage tool use only)."
    hard_step_tau: {dist: earth_interval}
    bayes_update: false
    similarity:
      esi_file: data/esi_hz.json
      population: conservative
      exponents: [1, 2, 3, 5, 10]
      headline_exponent: 1
      min_n_by_type: 3                    # per-type ESI list used if >= 3 planets (M 22, K 3); G (1) and F (0) use the pooled list
    extra_params:
      f_superhab:     {dist: fixed, value: 0.0}     # kept (fixed) so the random stream stays paired with nathan_headline
      superhab_boost: {dist: fixed, value: 1.0}
      n_tool_origins: {dist: loguniform, low: 3.0, high: 7.0, best: 6.0, unit: "effective number of independent origins of tool use among complex animals on Earth; tau_stone_tool_intelligence = 0.5967 Gyr (Earth's multicellularity->stone-tools interval) / n",
                       source: "Low 3 = independent lithic-flake-producing primate lineages (hominins, Harmand+2015; bearded capuchins, Proffitt+2016 Nature 539, 85; long-tailed macaques, Proffitt+2023 Sci.Adv. 9, eade8159). Best 6 = the user's list, each verified: primates (Goodall 1964 Nature 201, 1264), corvids (Hunt 1996 Nature 379, 249), octopus (Finn, Tregenza & Norman 2009 Curr.Biol. 19, R1069), sea otters (Hall & Schaller 1964 J.Mammal. 45, 287), dolphins (Kruetzen+2005 PNAS 102, 8939), elephants (Hart+2001 Anim.Behav. 62, 839). High 7 = classes with documented tool use (Bentley-Condit & Smith 2010 Behaviour 147, 185: three phyla, seven classes). Mapping origins -> Poisson rate (n events in ~0.6 Gyr => expected first-origin time 0.6/n Gyr) is ASSUMED",
                       url: "https://doi.org/10.1038/nature20112 ; https://www.science.org/doi/10.1126/sciadv.ade8159 ; https://brill.com/view/journals/beh/147/2/article-p185_3.xml"}
  nathan_headline_no_tooluse:
    multispectral: true      # v2: M/K/G/F host classes
    multiphase: true         # v2: civilisation stages
    description: "Sensitivity: nathan_headline without the cross-lineage tool-use change (superhabitability only). similarity_weighted = neither."
    hard_step_tau: {dist: earth_interval}
    bayes_update: false
    similarity:
      esi_file: data/esi_hz.json
      population: conservative
      exponents: [1, 2, 3, 5, 10]
      headline_exponent: 1
      min_n_by_type: 3                    # per-type ESI list used if >= 3 planets (M 22, K 3); G (1) and F (0) use the pooled list
    extra_params:
      f_superhab:     {dist: loguniform, low: 0.03, high: 0.43, best: 0.104, unit: "fraction of K-dwarf habitable planets meeting the superhabitable criteria (~1.0-1.5 R_earth, ~5 K warmer); age 5-8 Gyr is handled by the time model; applied to K hosts only",
                       source: "ASSUMED bracket around an Archive-derived 0.104 = P(1.0<=R<=1.5 given HZ, R<2) 25/49 x P(T_surf 282-302 K given HZ, R<2) 10/49 (superhab.py; independence assumed). (v1 used 0.073 = 0.104 x K share 0.70 of G/K.) Criteria: Schulze-Makuch, Heller & Guinan 2020 Astrobiology 20, 1394 Table 2",
                       url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7757576/"}
      superhab_boost: {dist: loguniform, low: 1.0, high: 3.0, best: 1.73, unit: "multiplier (>1) on the per-planet step-success probability for superhabitable planets (capped so probability <= 1)",
                       source: "ASSUMED (user-suggested 1-3x). Schulze-Makuch+2020 and Heller & Armstrong 2014 (Astrobiology 14, 50) argue qualitatively for higher habitability/biomass but give no numeric factor",
                       url: "https://doi.org/10.1089/ast.2013.1088"}
      n_tool_origins_unused: {dist: loguniform, low: 3.0, high: 7.0, note: "drawn but NOT used, only so the random stream stays paired with nathan_headline"}
  similarity_weighted_no_rare_earth:
    description: "Variant of similarity_weighted that ALSO assumes similar planets share Earth's plate tectonics, land/ocean balance, large moon, Jupiter and binary outcome (those multipliers fixed at 1). Upper-end reading of the user's argument."
    hard_step_tau: {dist: earth_interval}
    bayes_update: false
    similarity:
      esi_file: data/esi_hz.json
      population: conservative
      exponents: [1, 2, 3, 5, 10]
      headline_exponent: 1
    overrides:
      f_plate_tectonics: {dist: fixed, value: 1.0}
      f_land_and_ocean:  {dist: fixed, value: 1.0}
      f_large_moon:      {dist: fixed, value: 1.0}
      f_jupiter_shield:  {dist: fixed, value: 1.0}
      f_binary_ok:       {dist: fixed, value: 1.0}
  earth_random_draw:
    description: "Earth's step timings treated as ONE random draw from each step's waiting-time distribution with an uninformative prior on whether Earth was fast or slow: Earth's interval x_k sits at a uniform-random quantile u_k of Exp(mean tau_k) => tau_k = x_k / E_k, E_k ~ Exp(1) (median tau = 1.44 x_k; equals the posterior of tau under a scale-invariant 1/tau prior from one observation). No observer-selection (Snyder-Beattie) correction."
    hard_step_tau: {dist: earth_random_draw}
    bayes_update: false

  baseline_no_exomoons:
    multispectral: true      # v2: M/K/G/F host classes
    multiphase: true         # v2: civilisation stages
    description: "Baseline with the exomoon term switched off (same random seed => paired comparison of the exomoon effect)."
    hard_step_tau: {dist: loguniform, low: 1.0e-3, high: 1.0e3}
    overrides:
      f_exomoon_host: {dist: fixed, value: 0.0}

# ---------------- Species per tool-using world (applied post hoc in analyze.py; independent of all other draws)
# Multiplies tool-using SPECIES, not worlds. species_now = N_now * species_concurrent; species_ever = N_ever * species_cumulative.
species:
  seed: 20261002
  species_concurrent_per_tool_world: {dist: loguniform, low: 1.0, high: 5.0, best: 2.38,
      unit: "time-averaged number of coexisting hominin(-grade) species on a world during its stone-age-or-later phase",
      source: "Derived from Smithsonian Human Origins 'When Lived' spans (21 species; 15 have fossils <=3.3 Ma): over 3.3 Ma-present the mean number of coexisting hominin species = 2.38 (best), max 5 (e.g. ~236 ka: H. erectus, heidelbergensis, naledi, neanderthalensis, sapiens), min 1 (today); Homo-only mean 1.75 over 2.4 Ma-present. Wood & Boyle 2016 AJPA: taxic diversity (>1 species) in every interval from 4 Ma to c.40 ka. Fossil spans are minima (Signor-Lipps) and taxonomy may be over-split.",
      url: "https://humanorigins.si.edu/evidence/human-fossils/species ; https://doi.org/10.1002/ajpa.22902"}
  species_cumulative_per_tool_world: {dist: uniform, low: 8.0, high: 16.0, best: 15.0,
      unit: "hominin species ever produced per tool-using world (~3.3 Myr of Earth's record)",
      source: "Smithsonian list: 8 Homo species, 15 hominin species with fossils in the stone-tool era (best); Wikipedia 'List of Homo species' names 16 Homo species incl. contested ones; USER figure 9-16 'humanoid species' (consistent). Earth-only, ~3.3 Myr; worlds with longer phases could have more.",
      url: "https://humanorigins.si.edu/evidence/human-fossils/species ; https://en.wikipedia.org/wiki/List_of_Homo_species"}
  context_total_named_species: {value: 2.3e6,
      source: "VERIFIED: Catalogue of Life estimates ~2.3M extant species recognised by taxonomists; COL Base Release 2026-07-14 lists 2,258,977 accepted species (incl. extinct), Extended Release 2,496,219. Context only (Earth's tool-using species / all named species ~ 1/2.3e6 today); not used in N.",
      url: "https://www.checklistbank.org/dataset/278910 ; https://www.catalogueoflife.org/data/download"}

# ---------------- Galaxy geometry for spacing (analyze.py)
geometry:
  disk_volume_ly3: 7.9e12     # USER-SUPPLIED ~7.9e12 ly^3; equals a cylinder of radius 50,000 ly x thickness 1,000 ly (pi*5e4^2*1e3 = 7.85e12)
  disk_radius_ly: 50000
  disk_thickness_ly: 1000

# ---------------- Classic static Drake (Sandberg-Drexler-Ord 2018 style), stone-age variant
classic_static:
  n_samples: 1000000
  R_star:   {dist: loguniform, low: 1, high: 100, source: "SDO 2018 Table 1", url: "https://arxiv.org/abs/1806.02404"}
  fp:       {dist: loguniform, low: 0.1, high: 1, source: "SDO 2018 Table 1", url: "https://arxiv.org/abs/1806.02404"}
  ne:       {dist: loguniform, low: 0.1, high: 1, source: "SDO 2018 Table 1", url: "https://arxiv.org/abs/1806.02404"}
  log10_lambdaVt: {dist: normal, mean: 0.0, sd: 50.0, source: "SDO 2018: fl = 1-exp(-lambda V t), log-normal, sigma = 50 decades, median 1", url: "https://arxiv.org/abs/1806.02404"}
  fi:       {dist: loguniform, low: 0.001, high: 1, source: "SDO 2018 Table 1", url: "https://arxiv.org/abs/1806.02404"}
  f_stone:  {dist: loguniform, low: 0.1, high: 1, source: "ASSUMED (replaces fc): fraction of intelligent lineages reaching habitual stone-tool use", url: "https://www.pnas.org/doi/10.1073/pnas.0607909104"}
  L_stone:  {dist: loguniform, low: 1.0e4, high: 1.0e9, source: "same as l_stone_yr above", url: "https://www.nature.com/articles/nature14464"}
